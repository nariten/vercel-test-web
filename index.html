<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格おみくじアプリ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fa;
            margin-top: 50px;
        }
        .container {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff4757;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #ff6b81; }
        .result-box { margin-top: 30px; min-height: 120px; }
        #fortune { font-size: 42px; font-weight: bold; color: #ff4757; margin: 10px 0; }
        #lucky-item { color: #555; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔮 オンラインおみくじ</h1>
        <p>下のボタンを押して、今日の運勢を占おう！</p>
        
        <button id="draw-btn">おみくじを引く 🔄</button>

        <!-- 結果を表示するエリア -->
        <div class="result-box">
            <div id="fortune">？？</div>
            <div id="lucky-item"></div>
        </div>
    </div>

    <script>
        // ボタンがクリックされた時の動きを設定
        document.getElementById('draw-btn').addEventListener('click', async () => {
            const fortuneText = document.getElementById('fortune');
            const itemText = document.getElementById('lucky-item');
            
            fortuneText.innerText = "占う中...";
            itemText.innerText = "";

            try {
                // 1. Node.jsのAPI（/api）にデータをちょうだい！とリクエストを送る
                const response = await fetch('/api');
                const data = await response.json();

                // 2. 返ってきたデータを使って画面を書き換える
                fortuneText.innerText = data.fortune;
                itemText.innerText = ` 今日のラッキーアイテム: ${data.luckyItem}`;
            } catch (error) {
                fortuneText.innerText = "エラー 💧";
                itemText.innerText = "データの取得に失敗しました。";
            }
        });
    </script>
</body>
</html>
